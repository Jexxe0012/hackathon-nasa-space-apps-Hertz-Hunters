<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luces · Earth Jukebox</title>
<meta name="description" content="Las luces nocturnas de El Salvador de 2012 a 2023, convertidas en sonido. NASA SVS 5276 · Hertz Hunters.">
<style>
  :root {
    --fondo: #f6f8fa; --tarjeta: #ffffff; --texto: #12202e; --suave: #4a5b6c; --borde: #c9d3dd;
    --acento: #7a4fd1; --acento-texto: #ffffff; --ref: #b07a12; --comp: #8a97a6; --foco: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #0d1520; --tarjeta: #152232; --texto: #e8eef5; --suave: #a7b6c6; --borde: #2c3e52;
      --acento: #b79cff; --acento-texto: #0d1520; --ref: #e8b44a; --comp: #6f7f91;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.55rem; line-height: 1.25; margin: 4px 0 6px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .disco { color: var(--suave); font-size: 0.9rem; margin: 0; }
  .aviso { color: var(--suave); font-size: 0.95rem; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; margin: 14px 0; }
  .fila { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .fila label { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 100%; }
  select { max-width: 100%; }
  .anio { font-size: 2.4rem; font-weight: 700; line-height: 1.1; margin: 2px 0 2px; font-variant-numeric: tabular-nums; }
  .estado { font-weight: 600; margin-bottom: 10px; }
  input[type=range] { width: 100%; accent-color: var(--acento); height: 32px; }
  button, select { font: inherit; min-height: 44px; border-radius: 10px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); padding: 8px 14px; cursor: pointer; }
  button.principal { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); font-weight: 600; }
  button:disabled { opacity: 0.55; cursor: progress; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
  .teclas { color: var(--suave); font-size: 0.95rem; margin-top: 10px; }
  kbd { font: 0.85rem ui-monospace, monospace; border: 1px solid var(--borde); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--fondo); }
  details summary { cursor: pointer; font-weight: 600; font-size: 1.05rem; min-height: 32px; }
  details ul { padding-left: 1.2em; } details li { margin-bottom: 8px; }
  .ahora-explica { background: var(--fondo); border-radius: 8px; padding: 10px 12px; }
  footer { color: var(--suave); font-size: 0.85rem; margin-top: 24px; }
  .solo-lector { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .visual { margin: 0 0 12px; }
  .paneles { display: grid; grid-template-columns: 1.25fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .paneles { grid-template-columns: 1fr; } }
  .mundo { position: relative; aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; border-radius: 10px; overflow: hidden; }
  .zoom { position: relative; aspect-ratio: 450 / 360; background: #000 center / cover no-repeat; border-radius: 10px; overflow: hidden;
    outline: 2px solid rgba(255,255,255,.85); outline-offset: -2px; transition: box-shadow .12s ease-out; }
  .zoom.pulso { box-shadow: inset 0 0 18px rgba(255,255,255,.5); }
  .recuadro { position: absolute; border: 2px solid #fff; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.6); min-width: 10px; min-height: 8px; }
  .zona-medida { position: absolute; border: 2px dashed #fff; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
  .leyenda-mapa { font-size: .82rem; color: var(--suave); margin: 4px 0 0; line-height: 1.35; }
  #curva { width: 100%; height: auto; display: block; margin-top: 8px; }
  @media (max-width: 480px) { .fila button { flex: 1 1 auto; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="disco" data-t="disco"></p>
    <h1 data-t="titulo"></h1>
    <p class="aviso" data-t="aviso"></p>
    <div class="fila">
      <label><span data-t="idioma"></span>
        <select id="idioma"><option value="es">Español</option><option value="en">English</option></select></label>
    </div>
  </header>

  <section class="tarjeta" aria-labelledby="h-anio">
    <h2 id="h-anio" class="solo-lector" data-t="h_anio"></h2>
    <figure class="visual" aria-hidden="true">
      <div class="paneles">
        <div><div class="mundo" id="mundo"><div class="recuadro" id="recuadro"></div></div><p class="leyenda-mapa" data-t="mapa_mundo"></p></div>
        <div><div class="zoom" id="zoom"><div class="zona-medida" id="zona-medida"></div></div><p class="leyenda-mapa" data-t="mapa_zoom"></p></div>
      </div>
      <svg id="curva" viewBox="0 0 480 150"></svg>
    </figure>
    <p class="anio" id="anio"></p>
    <p class="estado" id="estado"></p>
    <label for="control-anio" data-t="anio_control"></label>
    <input type="range" id="control-anio" min="1" max="12" step="1" value="1">
  </section>

  <section class="tarjeta" aria-labelledby="h-controles">
    <h2 id="h-controles" data-t="h_controles"></h2>
    <div class="fila">
      <button type="button" class="principal" id="btn-demo"></button>
      <button type="button" id="btn-play"></button>
      <button type="button" id="btn-prev"></button>
      <button type="button" id="btn-next"></button>
    </div>
    <p class="teclas" id="teclas"></p>
  </section>

  <section class="tarjeta">
    <details>
      <summary data-t="porque"></summary>
      <div id="porque-texto"></div>
      <p class="ahora-explica" id="ahora-explica"></p>
    </details>
  </section>

  <section class="tarjeta" aria-labelledby="h-exportar">
    <h2 id="h-exportar" data-t="h_exportar"></h2>
    <p data-t="exportar_texto"></p>
    <button type="button" id="btn-exportar"></button>
    <p id="estado-export" role="status"></p>
  </section>

  <div id="anuncio" class="solo-lector" aria-live="polite"></div>
  <footer data-t="pie"></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script>window.Tone || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"><\/script>');</script>
<script src="motor-luces.js"></script>
<script src="app.js"></script>
</body>
</html>

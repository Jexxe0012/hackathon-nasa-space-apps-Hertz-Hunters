<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bosques · Earth Jukebox</title>
<meta name="description" content="Del corazón del Amazonas al borde donde se acaba el bosque alto, convertido en sonido. NASA SVS 4950 (GEDI) · Hertz Hunters.">
<style>
  :root { --fondo: #f6f8fa; --tarjeta: #ffffff; --texto: #12202e; --suave: #4a5b6c; --borde: #c9d3dd; --acento: #5a7d2b; --acento-texto: #ffffff; --foco: #f59e0b; --corte: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fondo: #0d1520; --tarjeta: #152232; --texto: #e8eef5; --suave: #a7b6c6; --borde: #2c3e52; --acento: #a8cf6a; --acento-texto: #0d1520; --corte: #f59e0b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.55rem; line-height: 1.25; margin: 4px 0 6px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .disco { color: var(--suave); font-size: 0.9rem; margin: 0; }
  .aviso { color: var(--suave); font-size: 0.95rem; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; margin: 14px 0; }
  .fila { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .fila label { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 100%; }
  select { max-width: 100%; }
  button, select { font: inherit; min-height: 44px; border-radius: 10px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); padding: 8px 14px; cursor: pointer; }
  button.principal { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); font-weight: 600; }
  button:disabled { opacity: 0.55; cursor: progress; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
  .mapa { position: relative; aspect-ratio: 16 / 9; background: #000 url(globo.webp) center / cover no-repeat; border-radius: 10px; overflow: hidden; }
  .mapa svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .barras { display: flex; align-items: flex-end; gap: 4px; height: 110px; margin: 10px 0 2px; padding: 0 2px; border-bottom: 1px solid var(--borde); }
  .barra { flex: 1; background: var(--acento); border-radius: 3px 3px 0 0; opacity: 0.18; transition: opacity .2s, height .25s; }
  .barra.oida { opacity: 1; }
  .barra.ahora { outline: 2px solid var(--foco); }
  .barra.borde { background: var(--corte); }
  .ejes { display: flex; justify-content: space-between; color: var(--suave); font-size: .8rem; }
  .lugar { min-height: 1.6em; font-weight: 600; margin: 8px 0 0; }
  .teclas { color: var(--suave); font-size: 0.95rem; margin-top: 10px; }
  kbd { font: 0.85rem ui-monospace, monospace; border: 1px solid var(--borde); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--fondo); }
  details summary { cursor: pointer; font-weight: 600; font-size: 1.05rem; min-height: 32px; }
  details ul { padding-left: 1.2em; } details li { margin-bottom: 8px; }
  footer { color: var(--suave); font-size: 0.85rem; margin-top: 24px; }
  .solo-lector { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (max-width: 480px) { .fila button { flex: 1 1 auto; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="disco" data-t="disco"></p>
    <h1 data-t="titulo"></h1>
    <p class="aviso" data-t="aviso"></p>
    <div class="fila">
      <label class="solo-pagina"><span data-t="idioma"></span>
        <select id="idioma"><option value="es">Español</option><option value="en">English</option></select></label>
    </div>
  </header>

  <section class="tarjeta" aria-labelledby="h-camino">
    <h2 id="h-camino" data-t="h_camino"></h2>
    <div class="mapa" aria-hidden="true"><svg id="capa" viewBox="0 0 3840 2160" preserveAspectRatio="none"></svg></div>
    <div class="barras" id="barras" aria-hidden="true"></div>
    <div class="ejes" aria-hidden="true"><span data-t="eje_norte"></span><span data-t="eje_sur"></span></div>
    <p class="lugar" id="lugar" aria-hidden="true"></p>
    <div class="fila" style="margin-top:10px">
      <button type="button" class="solo-pagina principal" id="btn-escuchar"></button>
      <button type="button" class="solo-pagina" id="btn-play"></button>
    </div>
    <p class="solo-pagina teclas" id="teclas"></p>
    <p id="estado" role="status" class="solo-lector"></p>
  </section>

  <section class="tarjeta solo-pagina">
    <details><summary data-t="porque"></summary><div id="porque-texto"></div></details>
  </section>

  <section class="tarjeta solo-pagina" aria-labelledby="h-exportar">
    <h2 id="h-exportar" data-t="h_exportar"></h2>
    <p data-t="exportar_texto"></p>
    <button type="button" id="btn-exportar"></button>
    <p id="estado-export" role="status"></p>
  </section>
  <footer data-t="pie"></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script>window.Tone || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"><\/script>');</script>
<script src="../comun/incrustado.js?v=4"></script>
<script src="motor-bosques.js"></script>
<script src="app.js"></script>
</body>
</html>

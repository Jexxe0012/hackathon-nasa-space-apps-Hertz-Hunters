<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerosoles · Earth Jukebox</title>
<meta name="description" content="Escucha las partículas del aire del planeta el 19 de agosto de 2025: polvo, sal marina, sulfatos y humo. NASA SVS 5669 · Hertz Hunters.">
<style>
  :root { --fondo: #f6f8fa; --tarjeta: #ffffff; --texto: #12202e; --suave: #4a5b6c; --borde: #c9d3dd; --acento: #2f8f2f; --acento-texto: #ffffff; --foco: #f59e0b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fondo: #0d1520; --tarjeta: #152232; --texto: #e8eef5; --suave: #a7b6c6; --borde: #2c3e52; --acento: #6bd96b; --acento-texto: #0d1520; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.55rem; line-height: 1.25; margin: 4px 0 6px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .disco { color: var(--suave); font-size: 0.9rem; margin: 0; }
  .aviso { color: var(--suave); font-size: 0.95rem; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; margin: 14px 0; }
  .fila { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .fila label { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 100%; }
  button, select { font: inherit; min-height: 44px; border-radius: 10px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); padding: 8px 14px; cursor: pointer; }
  button.principal { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); font-weight: 600; }
  button:disabled { opacity: 0.55; cursor: progress; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
  .mapa { position: relative; aspect-ratio: 16 / 9; background: #000 url(mapa.webp) center / cover no-repeat; border-radius: 10px; overflow: hidden; cursor: crosshair; }
  .sub { color: var(--suave); margin: 0 0 10px; }
  .pin { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.6); display: none; }
  .pin span { position: absolute; right: 14px; top: -4px; color: #fff; font-size: 11px; font-weight: 600; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  .zona-hist { position: absolute; border: 2px solid rgba(255,255,255,.9); border-radius: 4px; box-shadow: 0 0 0 9999px rgba(0,0,0,.42); pointer-events: none; }
  .fecha-mapa { font-weight: 700; font-size: .95rem; margin: 0 0 6px; }
  select { max-width: 100%; }
  .radar { position: absolute; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 10px 3px rgba(255,255,255,.6); }
  .historia { min-height: 1.6em; font-weight: 600; margin: 8px 0 0; }
  .leyenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 12px; }
  .tipo { display: flex; gap: 10px; align-items: center; border: 1px solid var(--borde); border-radius: 10px; padding: 8px 10px; cursor: pointer; min-height: 44px; }
  .tipo input { width: 20px; height: 20px; accent-color: var(--acento); }
  .chip { width: 18px; height: 18px; border-radius: 4px; flex: none; }
  .tipo small { display: block; color: var(--suave); font-size: .8rem; line-height: 1.2; }
  .teclas { color: var(--suave); font-size: 0.95rem; margin-top: 10px; }
  kbd { font: 0.85rem ui-monospace, monospace; border: 1px solid var(--borde); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--fondo); }
  details summary { cursor: pointer; font-weight: 600; font-size: 1.05rem; min-height: 32px; }
  details ul { padding-left: 1.2em; } details li { margin-bottom: 8px; }
  footer { color: var(--suave); font-size: 0.85rem; margin-top: 24px; }
  .solo-lector { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (max-width: 480px) { .fila button { flex: 1 1 auto; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="disco" data-t="disco"></p>
    <h1 data-t="titulo"></h1>
    <p class="aviso" data-t="aviso"></p>
    <div class="fila">
      <label class="solo-pagina"><span data-t="idioma"></span>
        <select id="idioma"><option value="es">Español</option><option value="en">English</option></select></label>
      <label><span data-t="historia_lbl"></span><select id="historia-sel"></select></label>
    </div>
  </header>

  <section class="tarjeta" aria-labelledby="h-mapa">
    <h2 id="h-mapa"></h2>
    <p class="sub" id="sub"></p>
    <p class="fecha-mapa" id="fecha-mapa"></p>
    <div class="mapa" id="mapa" aria-hidden="true"><div class="zona-hist" id="zona-hist"></div><div class="radar" id="radar"></div><div class="pin" id="pin"><span id="pin-texto"></span></div></div>
    <p class="historia" id="historia" aria-hidden="true"></p>
    <div class="fila" style="margin-top:10px">
      <button type="button" class="solo-pagina principal" id="btn-escuchar"></button>
      <button type="button" class="solo-pagina" id="btn-play"></button>
    </div>
    <fieldset class="leyenda" id="leyenda" style="border:0;padding:0;margin:12px 0 0">
      <legend class="solo-lector" data-t="leyenda"></legend>
    </fieldset>
    <p class="solo-pagina teclas" id="teclas"></p>
    <p id="estado" role="status" class="solo-lector"></p>
  </section>

  <section class="tarjeta solo-pagina">
    <details><summary data-t="porque"></summary><div id="porque-texto"></div></details>
  </section>

  <section class="tarjeta solo-pagina" aria-labelledby="h-exportar">
    <h2 id="h-exportar" data-t="h_exportar"></h2>
    <p data-t="exportar_texto"></p>
    <button type="button" id="btn-exportar"></button>
    <p id="estado-export" role="status"></p>
  </section>
  <footer data-t="pie"></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script>window.Tone || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"><\/script>');</script>
<script src="../comun/incrustado.js?v=6"></script>
<script src="motor-aerosoles.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
